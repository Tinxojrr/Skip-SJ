      <text x="10" y="34" fill="#cbd5e1" font-size="9">Gemini 3 Flash con métricas</text>

      <rect x="0" y="56" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="74" fill="#38bdf8" font-size="11" font-weight="700">⏱ Tiempos Predictivos</text>
      <text x="10" y="90" fill="#94a3b8" font-size="9">Semáforo vivo de cola (🟢🟡🔴)</text>

