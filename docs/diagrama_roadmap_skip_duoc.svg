      <rect x="0" y="224" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="242" fill="#c084fc" font-size="11" font-weight="700">💳 Billetera de Saldo</text>
      <text x="10" y="258" fill="#94a3b8" font-size="9">Carga prepago de recreo</text>
