      <text x="10" y="146" fill="#94a3b8" font-size="9">Lectura de tarjetas y comprobantes</text>

      <rect x="0" y="168" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="186" fill="#38bdf8" font-size="11" font-weight="700">📦 Control de Stock Vivo</text>
      <text x="10" y="202" fill="#94a3b8" font-size="9">Pausar/activar platos al instante</text>

      <rect x="0" y="224" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="242" fill="#38bdf8" font-size="11" font-weight="700">📊 Reportes por Turno</text>
