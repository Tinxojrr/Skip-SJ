<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Marcadores de Flechas -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Encabezado -->
  <text x="500" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="1">
    SKIP DUOC UC — PRODUCT ROADMAP EVOLUTIVO
  </text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">
    Evolución planificada por fases de valor: Desde el MVP funcional hasta el escalamiento multi-sede
  </text>

  <!-- Línea de tiempo horizontal conectora -->
  <line x1="120" y1="95" x2="880" y2="95" stroke="#334155" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- FASE 1: MVP -->
  <g transform="translate(40, 115)">
    <!-- Pin / Indicador -->
