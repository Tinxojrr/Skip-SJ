    <text x="105" y="-15" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="900">v1.0</text>
    
    <!-- Tarjeta -->
    <rect width="210" height="360" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect width="210" height="36" rx="14" fill="#10b981" opacity="0.2"/>
    <text x="105" y="24" text-anchor="middle" fill="#34d399" font-size="12" font-weight="800">
      FASE 1: MVP CORE
    </text>
    <text x="105" y="48" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">
      [ ESTADO: COMPLETADO ]
    </text>

    <!-- Hitos -->
    <g transform="translate(14, 62)">
      <rect x="0" y="0" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="18" fill="#34d399" font-size="11" font-weight="700">✓ App Móvil Alumno</text>
      <text x="10" y="34" fill="#94a3b8" font-size="9">Catálogo, carrito y checkout</text>

      <rect x="0" y="56" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="74" fill="#34d399" font-size="11" font-weight="700">✓ Kanban en Cocina</text>
      <text x="10" y="90" fill="#94a3b8" font-size="9">WebSockets con sonido chime</text>

      <rect x="0" y="112" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="130" fill="#34d399" font-size="11" font-weight="700">✓ Código Retiro 4D</text>
      <text x="10" y="146" fill="#94a3b8" font-size="9">Identificador corto (ej: B3MR)</text>

      <rect x="0" y="168" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="186" fill="#34d399" font-size="11" font-weight="700">✓ Seguridad RLS</text>
      <text x="10" y="202" fill="#94a3b8" font-size="9">PostgreSQL con roles de local</text>

