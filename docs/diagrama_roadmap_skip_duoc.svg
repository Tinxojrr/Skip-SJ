      <text x="10" y="18" fill="#fbbf24" font-size="11" font-weight="700">🏫 Expansión de Sedes</text>
      <text x="10" y="34" fill="#94a3b8" font-size="9">Plaza Vespucio, Maipú, A. Varas</text>

      <rect x="0" y="56" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="74" fill="#fbbf24" font-size="11" font-weight="700">📈 Dashboard Institucional</text>
      <text x="10" y="90" fill="#94a3b8" font-size="9">Métricas para Casa Central Duoc</text>

      <rect x="0" y="112" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="130" fill="#fbbf24" font-size="11" font-weight="700">🤖 Forecasting Predictivo</text>
      <text x="10" y="146" fill="#94a3b8" font-size="9">Proyección de compras e insumos</text>

      <rect x="0" y="168" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="186" fill="#fbbf24" font-size="11" font-weight="700">🔗 Integración Portal Duoc</text>
      <text x="10" y="202" fill="#94a3b8" font-size="9">Single Sign-On (SSO Duoc)</text>

      <rect x="0" y="224" width="182" height="48" rx="8" fill="#1e293b"/>
      <text x="10" y="242" fill="#fbbf24" font-size="11" font-weight="700">🛡 Certificación ISO</text>
      <text x="10" y="258" fill="#94a3b8" font-size="9">Auditoría y alta disponibilidad</text>
    </g>
  </g>

  <!-- Footer con badges -->
  <rect x="40" y="490" width="925" height="22" rx="4" fill="#0f172a"/>
  <text x="500" y="505" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">
    Enfoque Ágil e Incremental • Entregas de Valor Continuas • Duoc UC Sede San Joaquín 2026
  </text>
</svg>

